<div class="login-container">
  <div class="login-card">
    <img src="assets/Logo-zenners.jpg" alt="Electrónica Zenner's" class="login-logo">
    <h1 class="login-title">Gestión de Taller</h1>
    <p class="login-subtitle">Iniciá sesión para continuar</p>

    @if (auth.errorMsg(); as msg) {
      <div class="login-error">{{ msg }}</div>
    }

    <form [formGroup]="formularioLogin" (ngSubmit)="login()" class="login-form">
      <div class="login-field">
        <input type="text" class="login-input" formControlName="usuario"
               placeholder="Usuario" autocomplete="username">
      </div>
      <div class="login-field">
        <input type="password" class="login-input" formControlName="password"
               placeholder="Contraseña" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login" [disabled]="submitting">
        @if (submitting) {
          <span class="login-spinner"></span> Ingresando...
        } @else {
          Ingresar
        }
      </button>
    </form>
  </div>
</div>
